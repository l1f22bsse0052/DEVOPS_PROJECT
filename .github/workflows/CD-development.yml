name: cd-development
on:
  workflow_run:
    workflows: ["ci-development"]
    types: completed
    branches: [develop]
jobs:
  deploy-using-hook:
    if: ${{github.event.workflow_run.conclusion == 'success'}}
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: deploy using hook
        env:
          Hook: ${{secrets.RENDER_DEPLOYMENT_HOOK}}
        run: |
          curl -X POST "$Hook"
        
    
  
  
